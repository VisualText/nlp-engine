name: Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  # Build the tagged commit so the release binary carries the right version.
  push:
    tags:
      - '*'

jobs:
  build_engine:
    name: Build NLP-ENGINE (${{ matrix.display_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: docker-ubuntu-20.04
            runner: ubuntu-22.04
            version_suffix: "20.04"
            docker_image: "ubuntu:20.04"
            display_name: "ubuntu-20.04"
          - id: ubuntu-22.04
            runner: ubuntu-22.04
            version_suffix: "22.04"
            display_name: "ubuntu-22.04"
          - id: ubuntu-latest
            runner: ubuntu-latest
            version_suffix: "latest"
            display_name: "ubuntu-latest"

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VERSION_SUFFIX: ${{ matrix.version_suffix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # ===============================
      # Ubuntu 20.04 (Docker Build)
      # ===============================
      - name: Build and Run (Ubuntu 20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -euo pipefail
          # Pull the target image directly (with retries) and run the build
          # script in it via the runner's pre-installed Docker. This replaces
          # addnab/docker-run-action@v3, which first builds a docker:20.10
          # helper image -- that Docker Hub pull was intermittently timing out
          # ("failed to resolve docker.io/library/docker:20.10 ... i/o timeout")
          # and failing the whole Linux job.
          for attempt in 1 2 3 4 5; do
            if docker pull ubuntu:20.04; then break; fi
            echo "docker pull ubuntu:20.04 failed (attempt $attempt); retrying in 20s..."
            sleep 20
          done
          docker run --rm \
            --shm-size=512m \
            --mount type=tmpfs,destination=/dev/shm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash scripts/build-ubuntu-2004.sh

      - name: Upload ICU Libraries Zip (20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: icu-libs-ubuntu-${{ env.VERSION_SUFFIX }}
          path: ./icu-libs.zip

      - name: Upload nlpengine-compile-libs zip (20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpengine-compile-libs-linux-${{ env.VERSION_SUFFIX }}.zip
          path: nlpengine-compile-libs-linux-20.04.zip

      # ===============================
      # Non-20.04 (Normal Build)
      # ===============================
      - name: Install Required Dependencies (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: |
          sudo apt update
          sudo apt install -y autoconf-archive pkg-config python3 ninja-build build-essential cmake g++ git curl zip unzip tar

      - name: Vcpkg Bootstrap Shell (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: ./bootstrap-vcpkg.sh
        shell: bash
        working-directory: vcpkg

      - name: Install 3rd Party (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: vcpkg install
        working-directory: vcpkg

      - name: Create Build Directory (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: mkdir -p build

      - name: Generate Solution Linux (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_BUILD_TYPE=release \
            -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Cmake Build all targets Linux (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: cmake --build build/ --target all

      - name: Test executable --version (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: ./bin/nlp --version || true

      - name: Full-dict binary-search hang regression (#669, Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          # An em-dash sorts after every word in the lazy "*full.dict"; that used
          # to make the dict binary search loop forever (#669: afterKey=-1 at EOF
          # -> lo=-1). The fixture is self-contained (tiny sorted zz-full.dict +
          # em-dash input). A hang -> `timeout` exits 124 -> this step fails.
          # NOTE: no `|| true` here on purpose -- we WANT a hang to fail CI.
          timeout 120 ./bin/nlp -ANA .github/workflows/tests/fulldict-hang \
            -WORK ./ .github/workflows/tests/fulldict-hang/input/dash.txt
          echo "[#669 regression] analyzer completed without hanging"

      - name: Function names with digits regression (#698, Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # The rule-file tokenizer splits "Round2" into "Round" + "2", so
          # user functions whose name held a digit or an underscore never
          # matched the "_LIT \(" function grammar and the analyzer died with
          # a misleading "[Warning: Missing ';']". The fixture also asserts
          # that @RULES literals ("covid19", "a1 \(") still tokenize the old
          # way -- the glom must only fire on an unescaped "(".
          FIX=.github/workflows/tests/fnname-digits
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          # Windows always leaves a make_ana.log behind; Linux only writes one
          # when the build had something to say. Print it if it's there.
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          # nlp exits 0 even when the analyzer fails to build, so assert the
          # output, not the exit code.
          if [ ! -f "$OUT" ]; then
            echo "FAIL(#698): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          if [ "$got" != "3 21 201 2001 1 8 71" ]; then
            echo "FAIL(#698): out.txt was '$got'"; exit 1
          fi
          grep -q '_COVID' "$TREE" || { echo "FAIL(#698): literal covid19 no longer matches two tokens"; exit 1; }
          grep -q '_APAREN' "$TREE" || { echo "FAIL(#698): escaped '\\(' literal regressed"; exit 1; }
          echo "[#698 regression] digit/underscore function names compile and run"

      - name: Block comment regression (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # NLP++ knew only "#" line comments, so a C-style "/* ... */" in a
          # pass file lexed as ordinary tokens and died with "[Syntax error.]".
          # The fixture checks that comments are skipped everywhere (@DECL,
          # @CODE, around and inside @RULES), that "/*" and "*/" inside a
          # string or a "#" comment stay text, that "/" and "*" still parse as
          # operators, and that a rule can still match a literal "/" "*" in
          # the INPUT text (_SLASHSTAR / _STARSLASH).
          FIX=.github/workflows/tests/block-comments
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          # nlp exits 0 even when the analyzer fails to build, so assert the
          # output, not the exit code.
          if [ ! -f "$OUT" ]; then
            echo "FAIL(block comments): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want='a string with /* and */ inside|/*/|7|12|43|esc: * /'
          if [ "$got" != "$want" ]; then
            echo "FAIL(block comments): out.txt was '$got'"; exit 1
          fi
          grep -q '_SLASHSTAR' "$TREE" || { echo "FAIL(block comments): rule matching a literal '/' '*' in input regressed"; exit 1; }
          grep -q '_STARSLASH' "$TREE" || { echo "FAIL(block comments): rule matching a literal '*' '/' in input regressed"; exit 1; }
          echo "[block comments] /* */ is skipped in pass files"

      - name: Block comment regression, data files (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # The line-oriented data files have their own hand-written C lexers,
          # so they get block comments from the shared stripper in
          # cs/libconsh/blockcom.cpp rather than from the RFB grammar. The
          # fixture puts comments in all four -- .seq (where a leading "/"
          # already means "inactive pass"), .kb, .dict and .kbb -- and probes
          # the loaded KB to prove the entries around them survived intact.
          FIX=.github/workflows/tests/block-comments-data
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          # Dump every log the run produced. A KB-load failure (eg a bad .kb
          # command) only ever reaches cgerr.log, so without this a failure
          # here surfaces as "no out.txt" with no reason attached.
          for f in "$FIX"/logs/*.log; do
            [ -f "$f" ] || continue
            echo "----- $f"; cat "$f"
          done
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(data block comments): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want='zzTrailing|kbliteral|kbstarslash|kept|starred'
          if [ "$got" != "$want" ]; then
            echo "FAIL(data block comments): out.txt was '$got'"; exit 1
          fi
          # .dict string values must keep their delimiters byte-for-byte.
          grep -qF '("note" "a /* b */ c")' "$TREE" || { echo "FAIL(data block comments): dict string lost its /* */"; exit 1; }
          grep -qF '("note" "lone * and / here")' "$TREE" || { echo "FAIL(data block comments): dict string lost its * or /"; exit 1; }
          echo "[block comments] /* */ is skipped in .seq, .kb, .dict and .kbb"

      - name: struniquechars regression (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # str_unique_chars() used to rebuild an icu::StringPiece over its
          # OUTPUT buffer, call u_strlen() on it and re-decode it with
          # U8_NEXT -- once per input character. This pins the observable
          # behavior of struniquechars(), including multi-byte UTF-8, so the
          # rewrite (and any future one) cannot drift.
          FIX=.github/workflows/tests/struniquechars
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(struniquechars): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%b' 'abc|abc|a|abcdefg|helo wrd|3|ab\xc3\xa9\xc3\xbc|\xe6\x97\xa5\xe6\x9c\xac\xe8\xaa\x9e')
          if [ "$got" != "$want" ]; then
            echo "FAIL(struniquechars): out.txt was '$got' (wanted '$want')"; exit 1
          fi
          echo "[struniquechars] unique-character extraction is UTF-8 correct"

      - name: regexp/regexpi glob matching (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # regexp() and regexpi() returned false for EVERY input: the "no
          # literal yet" marker in Regexp::init was an empty string rather
          # than a null pointer, so every "has a literal" test read true, the
          # literal never bound and the pattern degenerated. regexpi() also
          # recursed into the case-SENSITIVE match(), losing case folding
          # after the first pattern element -- hence the i-multi line.
          FIX=.github/workflows/tests/regexp-glob
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(regexp glob): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'star-tail:cat|' \
            'star-head:Walking|JumPing|' \
            'star-both:Walking|cat|' \
            'literal:cat|' \
            'qmark:cat|' \
            'whole:0' \
            'i-multi:RUNNING|' \
            'i-head:RUNNING|Walking|JumPing|' \
            'nomatch:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(regexp glob): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[regexp glob] regexp/regexpi match, and regexpi folds case throughout"

      - name: Signed numbers in str() (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # str() converted a signed long long with the UNSIGNED "%llu", so
          # every negative printed as roughly 1.8e19 -- str(-1) gave
          # "18446744073709551615" -- which also made the documented -1
          # return of filesize() unreadable. The same fault was in the
          # compiled-analyzer path (Arun::str) and in the code generator.
          FIX=.github/workflows/tests/signed-str
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(signed str): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'expr:-1' 'big:-12345' 'filesize:-1' 'pos:42' 'zero:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(signed str): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[signed str] negative numbers render as negative"

      - name: User functions shadow builtins (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # Defining a function whose name is also a builtin used to be a hard
          # error, so adding any builtin broke every analyzer that had already
          # defined that name -- which is what happened to arrayreverse and
          # push, hand-written in visualText/spec/UtilFuncs.nlp long before
          # they became builtins. The user definition now wins, with a warning.
          FIX=.github/workflows/tests/shadowing
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(shadowing): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'shadowed:USER-WON' 'unshadowed:HELLO' 'stilldispatches:5')
          if [ "$got" != "$want" ]; then
            echo "FAIL(shadowing): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          if ! grep -q "shadows built-in" "$FIX/logs/make_ana.log"; then
            echo "FAIL(shadowing): no warning was logged"; exit 1
          fi
          echo "[shadowing] a user function overrides a builtin of the same name"

      - name: Copy nlp.exe to nlpl.exe (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: cp bin/nlp bin/nlpl.exe
        shell: bash

      # ===============================
      # Upload Artifacts (All Versions)
      # ===============================
      - name: Upload nlpl.exe
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-${{ env.VERSION_SUFFIX }}.exe
          path: bin/nlpl.exe

      - name: Upload libicutu.a (non ubuntu-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-${{ env.VERSION_SUFFIX }}.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicuuc.a (ubuntu-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-${{ env.VERSION_SUFFIX }}.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a

      - name: Package compile libraries (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compile-libs
          mkdir -p compile-libs/include/Api compile-libs/lib
          cp -r include/Api/. compile-libs/include/Api/
          cp -r cs/include compile-libs/include/cs

          for name in prim kbm consh words lite; do
            lib=$(find "$GITHUB_WORKSPACE" -type f -name "lib${name}.a" \
              -not -path "*/vcpkg/*" -not -path "*/vcpkg_installed/*" \
              -not -path "*/compile-libs/*" | head -n1)
            if [ -z "$lib" ]; then
              echo "Missing required static library: lib${name}.a" >&2
              exit 1
            fi
            cp "$lib" "compile-libs/lib/lib${name}.a"
          done

          # ICU static libs from vcpkg (matches the Windows ICU DLL trio:
          # data/uc/i18n). Downstream analyzer/KB linking against lite needs
          # i18n for Collator (find_str_nocase).
          for icu_lib in libicudata.a libicuuc.a libicui18n.a; do
            cp "vcpkg_installed/x64-linux/lib/$icu_lib" "compile-libs/lib/$icu_lib"
          done

          (cd compile-libs && zip -r "$GITHUB_WORKSPACE/nlpengine-compile-libs-linux-${VERSION_SUFFIX}.zip" .)

      - name: Upload nlpengine-compile-libs zip (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpengine-compile-libs-linux-${{ env.VERSION_SUFFIX }}.zip
          path: nlpengine-compile-libs-linux-${{ env.VERSION_SUFFIX }}.zip

      # ===============================
      # Run Tests
      # ===============================
      - name: Remove submodule analyzers before fresh checkout (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: rm -rf analyzers   # drop the pinned submodule copy so the checkout below lands cleanly

      - name: Checkout Analyzers Repo
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/checkout@v4
        with:
          repository: VisualText/analyzers
          submodules: recursive
          path: analyzers

      - name: Full English Test (20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./rfb-logs/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-lin.txt

      - name: Run English Parser Test (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: ./bin/nlp -ANA ./analyzers/parse-en-us -WORK ./ ./analyzers/parse-en-us/input/doj.txt -DEV || true

      - name: Full English Test (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./analyzers/parse-en-us/input/doj.txt_log/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-lin.txt

