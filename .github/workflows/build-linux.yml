      - name: factorial() up to 20! (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # factorial() checked its result against LONG_MAX, which is 32 bits
          # on Windows, so 13! and up reported an overflow there.
          FIX=.github/workflows/tests/factorial
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(factorial): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(head -1 "$OUT" | tr -d '\r')
          want='1 1 479001600 6227020800 2432902008176640000'
          if [ "$got" != "$want" ]; then
            echo "FAIL(factorial): got '$got', wanted '$want'"; exit 1
          fi
          # 21! does not fit in 64 bits and must still be reported.
          grep -q 'factorial: Overflow' "$FIX/input/text.txt_log/err.log" \
            || { echo "FAIL(factorial): 21! did not report an overflow"; exit 1; }
          echo "[factorial] 13! to 20! compute; 21! reports an overflow"

      - name: User functions shadow builtins (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # Defining a function whose name is also a builtin used to be a hard
          # error, so adding any builtin broke every analyzer that had already
          # defined that name -- which is what happened to arrayreverse and
          # push, hand-written in visualText/spec/UtilFuncs.nlp long before
          # they became builtins. The user definition now wins, with a warning.
          FIX=.github/workflows/tests/shadowing
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(shadowing): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'shadowed:USER-WON' 'unshadowed:HELLO' 'stilldispatches:5')
          if [ "$got" != "$want" ]; then
            echo "FAIL(shadowing): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          # make_analyzer only writes make_ana.log when logs/ already exists,
          # which is why the step recreates it above. Without that, Linux left
          # no log to grep while Windows created the directory on the way.
          if ! grep -q "shadows built-in" "$FIX/logs/make_ana.log"; then
            echo "FAIL(shadowing): the shadowing warning was never emitted"; exit 1
          fi
          echo "[shadowing] a user function overrides a builtin of the same name"

      - name: File-reading and regex builtins (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # NLP++ could write files but never read one, could not list a
          # directory, and regexp() was a "?"/"*" glob with no classes,
          # anchors, quantifiers or capture groups. This pins readfile,
          # readlines, dirlist, rematch, refind and resubst.
          # readfile's line is run through resubst so the expected output is
          # the same whether the fixture is checked out LF or CRLF, and the
          # dirlist line proves paths come back sorted with forward slashes
          # on every platform.
          FIX=.github/workflows/tests/file-regex
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(file/regex): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'dirlist:3:alpha.dict:beta.dict:config.txt' \
            'glob:2' \
            'readlines:2:name = widget:count = 42' \
            'readfile:name = widget|count = 42|' \
            'rematch:1010' \
            'refind:3:count:42' \
            'resubst:1a 2b 3c' \
            'empty:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(file/regex): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[file/regex] readfile, readlines, dirlist, rematch, refind, resubst"

      - name: String and array builtins (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # split() had no inverse, there was no way to get the index of a
          # substring, and every existing sort was knowledge-base or parse
          # tree oriented, leaving plain arrays with none. push() had been
          # documented as UNIMPLEMENTED.
          # sort: is byte order, so uppercase sorts ahead of lowercase.
          # neg: re-checks that str() renders negatives as negative.
          FIX=.github/workflows/tests/str-array
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(str/array): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'join:a-b-c' \
            'join1:solo' \
            'joinnum:1,2,3' \
            'idx:6/-1/0' \
            'lastidx:8/2' \
            'neg:-1/-1/-12345/42' \
            'sort:Banana,apple,cherry' \
            'sortdesc:cherry,apple,Banana' \
            'sortnum:2,10,100' \
            'sortnumdesc:100,10,2' \
            'unique:a,b,c' \
            'reverse:c,b,a' \
            'slice:b,c' \
            'sliceopen:c,d' \
            'sliceclamp:d' \
            'slicenone:' \
            'push:z,a,b,c' \
            'chain:A,B,C')
          if [ "$got" != "$want" ]; then
            echo "FAIL(str/array): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[str/array] strjoin, strindexof, arraysort/unique/reverse/slice, push"

      - name: Python pass interpreter and error reporting (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # The python pass hardcoded the command "python". macOS 12.3+ has no
          # /usr/bin/python and most Linux distros ship only python3, so on many
          # machines the pass silently did nothing: system() returns the shell's
          # exit status (127 for command-not-found), never <0, so the old rc<0
          # test never fired. For json2kbb that meant no .kbb was built and the
          # analyzer ran against an empty KB with no warning at all.
          FIX=.github/workflows/tests/python-pass
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log" "$FIX/marker.txt"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(python pass): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          if [ "$got" != "python:PYTHON-RAN-pre" ]; then
            echo "FAIL(python pass): the pass did not run. out.txt was '$got'"; exit 1
          fi
          # Now prove a missing interpreter is REPORTED rather than swallowed.
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log" "$FIX/marker.txt"
          mkdir -p "$FIX/logs"
          NLPPP_PYTHON=definitely-not-a-real-interpreter \
            ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt" > pyfail.out 2>&1 || true
          cat pyfail.out
          got=$(tr -d '\r' < "$OUT")
          if [ "$got" != "python:absent" ]; then
            echo "FAIL(python pass): expected the pass to be skipped, got '$got'"; exit 1
          fi
          if ! grep -q "python pass FAILED" pyfail.out; then
            echo "FAIL(python pass): a failing pass was not reported"; exit 1
          fi
          if ! grep -q "python pass" "$FIX/input/text.txt_log/err.log"; then
            echo "FAIL(python pass): the failure never reached err.log"; exit 1
          fi
          echo "[python pass] interpreter is resolved, and failures are reported"

      - name: JSON builtins (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # jsonwrite replaces the JsonKB family in KBFuncs.nlp, which is
          # interpreted NLP++ and dominates a knowledge-base analyzer's
          # runtime (43.9% of date-time was the 13-line output pass calling
          # JsonKB and SaveKB). Its output must stay byte-identical.
          # jsonparse is the inverse and removes the need for a python pass
          # to load JSON, which the npm and pypi distributions cannot run.
          # The round trip is the real assertion: it caught jsonparse storing
          # jsonwrite's synthesized "id" as a real attribute, which made the
          # second write emit it twice.
          FIX=.github/workflows/tests/json-builtins
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(json): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'parsed:1' 'roundtrip:same' 'badjson:0' 'notobject:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(json): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          # The serialized document must have the exact shape JsonKB produces.
          J="$FIX/input/text.txt_log/rt1.json"
          grep -q '"id": "1"' "$J" || { echo "FAIL(json): counted concepts lost their id"; exit 1; }
          grep -q '"item": \[' "$J" || { echo "FAIL(json): counted siblings did not become an array"; exit 1; }
          grep -qF 'He said \"hi\"' "$J" || { echo "FAIL(json): quote escaping regressed"; exit 1; }
          # And the round trip must not duplicate the synthesized id.
          if [ "$(grep -c '"id":' "$FIX/input/text.txt_log/rt2.json")" != "2" ]; then
            echo "FAIL(json): round trip duplicated the synthesized id"; exit 1
          fi
          echo "[json] jsonwrite serializes and jsonparse round-trips"

      - name: callanalyzer runs another analyzer, loaded once
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # callanalyzer (4.1.0) runs another analyzer's passes on one node of
          # this analyzer's parse tree, with this analyzer's KB. The callee
          # sits beside the caller, in tests/call-analyzer-callee, and is found
          # by name. The tree lines prove it changed only the nodes it was
          # given; crimson proves its lazy *full.dict was run on the passed
          # text; the load count proves it was built once for two calls.
          FIX=.github/workflows/tests/call-analyzer
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log" .github/workflows/tests/call-analyzer-callee/logs
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt" 2>&1 | tee "$FIX/logs/run.log"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(callanalyzer): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'loaded-before:0' \
            'call:1' \
            'call:1' \
            'loaded-after:1' \
            'mine:caller' \
            'tree:_sent _color apples* .' \
            'tree:_sent _color sky* and* _color grass* .' \
            'tree:Blue' \
            'concept:sent root:_ROOT sawcallerG:0 backcall:0 colors:red;' \
            'concept:sent root:_ROOT sawcallerG:0 backcall:0 colors:crimson;green;' \
            'red:angry yes' \
            'self:0' \
            'missing:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(callanalyzer): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          loads=$(grep -c 'callanalyzer: loaded call-analyzer-callee' "$FIX/logs/run.log" || true)
          if [ "$loads" != "1" ]; then
            echo "FAIL(callanalyzer): the called analyzer was loaded $loads times for two calls"; exit 1
          fi
          echo "[callanalyzer] called analyzer ran on the given nodes, loaded once"

      - name: Rule-level debug server (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # The engine can stop between rule attempts when started with
          # -DEBUG <port> (3.9.0). The hooks sit in Pat::matchRules, the hottest
          # loop in the engine, so they are exactly the kind of thing a later
          # change removes or reorders without anyone noticing until an author
          # finds the debugger silently never stops.
          FIX=.github/workflows/tests/rule-debugger
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          python3 "$FIX/drive.py" ./bin/nlp "$FIX" ./
          # Debugging must not change the analysis. Run the same fixture with no
          # debugger and require the parse tree to come out byte for byte the
          # same as the one the debugged run produced.
          cp "$FIX/input/text.txt_log/final.tree" /tmp/debugged.tree
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if ! diff -q /tmp/debugged.tree "$FIX/input/text.txt_log/final.tree" >/dev/null; then
            echo "FAIL(debug): the debugged run produced a different parse tree"
            diff /tmp/debugged.tree "$FIX/input/text.txt_log/final.tree" | head -20
            exit 1
          fi
          echo "[rule debugger] pause points fire and leave the analysis unchanged"

      - name: Copy nlp.exe to nlpl.exe (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: cp bin/nlp bin/nlpl.exe
        shell: bash

      # ===============================
      # Upload Artifacts (All Versions)
      # ===============================
      - name: Upload nlpl.exe
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-${{ env.VERSION_SUFFIX }}.exe
          path: bin/nlpl.exe

      - name: Upload libicutu.a (non ubuntu-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-${{ env.VERSION_SUFFIX }}.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicuuc.a (ubuntu-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-${{ env.VERSION_SUFFIX }}.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a

      - name: Package compile libraries (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf compile-libs
          mkdir -p compile-libs/include/Api compile-libs/lib
          cp -r include/Api/. compile-libs/include/Api/
          cp -r cs/include compile-libs/include/cs

          for name in prim kbm consh words lite; do
            lib=$(find "$GITHUB_WORKSPACE" -type f -name "lib${name}.a" \
              -not -path "*/vcpkg/*" -not -path "*/vcpkg_installed/*" \
              -not -path "*/compile-libs/*" | head -n1)
            if [ -z "$lib" ]; then
              echo "Missing required static library: lib${name}.a" >&2
              exit 1
            fi
            cp "$lib" "compile-libs/lib/lib${name}.a"
          done

          # ICU static libs from vcpkg (matches the Windows ICU DLL trio:
          # data/uc/i18n). Downstream analyzer/KB linking against lite needs
          # i18n for Collator (find_str_nocase).
          for icu_lib in libicudata.a libicuuc.a libicui18n.a; do
            cp "vcpkg_installed/x64-linux/lib/$icu_lib" "compile-libs/lib/$icu_lib"
          done

          (cd compile-libs && zip -r "$GITHUB_WORKSPACE/nlpengine-compile-libs-linux-${VERSION_SUFFIX}.zip" .)

      - name: Upload nlpengine-compile-libs zip (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpengine-compile-libs-linux-${{ env.VERSION_SUFFIX }}.zip
          path: nlpengine-compile-libs-linux-${{ env.VERSION_SUFFIX }}.zip

      # ===============================
      # Run Tests
      # ===============================
      - name: Remove submodule analyzers before fresh checkout (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: rm -rf analyzers   # drop the pinned submodule copy so the checkout below lands cleanly

      - name: Checkout Analyzers Repo
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/checkout@v4
        with:
          repository: VisualText/analyzers
          submodules: recursive
          path: analyzers

      - name: Full English Test (20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./rfb-logs/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-lin.txt

      - name: Run English Parser Test (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: ./bin/nlp -ANA ./analyzers/parse-en-us -WORK ./ ./analyzers/parse-en-us/input/doj.txt -DEV || true

      - name: Full English Test (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./analyzers/parse-en-us/input/doj.txt_log/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-lin.txt

