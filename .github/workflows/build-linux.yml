name: Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  # Build the tagged commit so the release binary carries the right version.
  push:
    # Also build on merges to master. Without a run on the default branch,
    # the vcpkg binary cache added alongside this is useless across PRs:
    # GitHub Actions lets a run read caches from its own ref and from the
    # DEFAULT branch only, and nothing ever ran on master -- so every PR
    # missed, rebuilt ICU (~10 min on Windows, ~4 min on Linux), and saved a
    # private copy no other PR could see. A master run seeds the shared entry
    # that PR runs then hit. It also means something finally verifies the
    # merge result, which nothing did before.
    branches:
      - master
    tags:
      - '*'

jobs:
  build_engine:
    name: Build NLP-ENGINE (${{ matrix.display_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: docker-ubuntu-20.04
            runner: ubuntu-22.04
            version_suffix: "20.04"
            docker_image: "ubuntu:20.04"
            display_name: "ubuntu-20.04"
          - id: ubuntu-22.04
            runner: ubuntu-22.04
            version_suffix: "22.04"
            display_name: "ubuntu-22.04"
          - id: ubuntu-latest
            runner: ubuntu-latest
            version_suffix: "latest"
            display_name: "ubuntu-latest"

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VERSION_SUFFIX: ${{ matrix.version_suffix }}
      # Re-use compiled vcpkg packages between runs; otherwise every run
      # rebuilds ICU from source (measured: 4m11s on Linux, 10m04s on Windows).
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # ===============================
      # Ubuntu 20.04 (Docker Build)
      # ===============================
      - name: Build and Run (Ubuntu 20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -euo pipefail
          # Pull the target image directly (with retries) and run the build
          # script in it via the runner's pre-installed Docker. This replaces
          # addnab/docker-run-action@v3, which first builds a docker:20.10
          # helper image -- that Docker Hub pull was intermittently timing out
          # ("failed to resolve docker.io/library/docker:20.10 ... i/o timeout")
          # and failing the whole Linux job.
          for attempt in 1 2 3 4 5; do
            if docker pull ubuntu:20.04; then break; fi
            echo "docker pull ubuntu:20.04 failed (attempt $attempt); retrying in 20s..."
            sleep 20
          done
          docker run --rm \
            --shm-size=512m \
            --mount type=tmpfs,destination=/dev/shm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:20.04 \
            bash scripts/build-ubuntu-2004.sh

      - name: Upload ICU Libraries Zip (20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: icu-libs-ubuntu-${{ env.VERSION_SUFFIX }}
          path: ./icu-libs.zip

      - name: Upload nlpengine-compile-libs zip (20.04)
        if: matrix.id == 'docker-ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpengine-compile-libs-linux-${{ env.VERSION_SUFFIX }}.zip
          path: nlpengine-compile-libs-linux-20.04.zip

      # ===============================
      # Non-20.04 (Normal Build)
      # ===============================
      - name: Install Required Dependencies (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: |
          sudo apt update
          sudo apt install -y autoconf-archive pkg-config python3 ninja-build build-essential cmake g++ git curl zip unzip tar

      - name: Vcpkg Bootstrap Shell (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: ./bootstrap-vcpkg.sh
        shell: bash
        working-directory: vcpkg

      # The submodule commit pins the ports, so it decides what the built
      # packages are; vcpkg.json decides which ones. Key on both. vcpkg checks
      # each package's ABI hash itself, so a partial restore-keys hit is safe:
      # anything that does not match is simply rebuilt.
      - name: Resolve vcpkg commit for cache key
        if: matrix.id != 'docker-ubuntu-20.04'
        id: vcpkgkey
        shell: bash
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binary packages
        if: matrix.id != 'docker-ubuntu-20.04'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.id }}-${{ steps.vcpkgkey.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.id }}-${{ steps.vcpkgkey.outputs.sha }}-
            vcpkg-${{ runner.os }}-${{ matrix.id }}-

      # vcpkg errors out if the binary-cache directory does not exist yet.
      - name: Create vcpkg binary cache dir
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg-bincache"

      - name: Install 3rd Party (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        # Same latent mismatch as the Windows job: use the vcpkg the
        # bootstrap step just produced rather than whatever is on PATH, so a
        # system vcpkg can never be paired with this repo's submodule root.
        # Linux has not broken on this yet; this keeps it from doing so.
        run: ./vcpkg install
        working-directory: vcpkg

      - name: Create Build Directory (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: mkdir -p build

      - name: Generate Solution Linux (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_BUILD_TYPE=release \
            -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Cmake Build all targets Linux (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: cmake --build build/ --target all --parallel $(nproc)

      - name: Test executable --version (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        run: ./bin/nlp --version || true

      - name: Full-dict binary-search hang regression (#669, Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          # An em-dash sorts after every word in the lazy "*full.dict"; that used
          # to make the dict binary search loop forever (#669: afterKey=-1 at EOF
          # -> lo=-1). The fixture is self-contained (tiny sorted zz-full.dict +
          # em-dash input). A hang -> `timeout` exits 124 -> this step fails.
          # NOTE: no `|| true` here on purpose -- we WANT a hang to fail CI.
          timeout 120 ./bin/nlp -ANA .github/workflows/tests/fulldict-hang \
            -WORK ./ .github/workflows/tests/fulldict-hang/input/dash.txt
          echo "[#669 regression] analyzer completed without hanging"

      - name: Function names with digits regression (#698, Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # The rule-file tokenizer splits "Round2" into "Round" + "2", so
          # user functions whose name held a digit or an underscore never
          # matched the "_LIT \(" function grammar and the analyzer died with
          # a misleading "[Warning: Missing ';']". The fixture also asserts
          # that @RULES literals ("covid19", "a1 \(") still tokenize the old
          # way -- the glom must only fire on an unescaped "(".
          FIX=.github/workflows/tests/fnname-digits
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          # Windows always leaves a make_ana.log behind; Linux only writes one
          # when the build had something to say. Print it if it's there.
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          # Assert the output too: an analyzer can load with rule errors and still
          # exit 0, so the exit code alone does not prove the rules worked.
          if [ ! -f "$OUT" ]; then
            echo "FAIL(#698): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          if [ "$got" != "3 21 201 2001 1 8 71" ]; then
            echo "FAIL(#698): out.txt was '$got'"; exit 1
          fi
          grep -q '_COVID' "$TREE" || { echo "FAIL(#698): literal covid19 no longer matches two tokens"; exit 1; }
          grep -q '_APAREN' "$TREE" || { echo "FAIL(#698): escaped '\\(' literal regressed"; exit 1; }
          echo "[#698 regression] digit/underscore function names compile and run"

      - name: Block comment regression (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # NLP++ knew only "#" line comments, so a C-style "/* ... */" in a
          # pass file lexed as ordinary tokens and died with "[Syntax error.]".
          # The fixture checks that comments are skipped everywhere (@DECL,
          # @CODE, around and inside @RULES), that "/*" and "*/" inside a
          # string or a "#" comment stay text, that "/" and "*" still parse as
          # operators, and that a rule can still match a literal "/" "*" in
          # the INPUT text (_SLASHSTAR / _STARSLASH).
          FIX=.github/workflows/tests/block-comments
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          # Assert the output too: an analyzer can load with rule errors and still
          # exit 0, so the exit code alone does not prove the rules worked.
          if [ ! -f "$OUT" ]; then
            echo "FAIL(block comments): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want='a string with /* and */ inside|/*/|7|12|43|esc: * /'
          if [ "$got" != "$want" ]; then
            echo "FAIL(block comments): out.txt was '$got'"; exit 1
          fi
          grep -q '_SLASHSTAR' "$TREE" || { echo "FAIL(block comments): rule matching a literal '/' '*' in input regressed"; exit 1; }
          grep -q '_STARSLASH' "$TREE" || { echo "FAIL(block comments): rule matching a literal '*' '/' in input regressed"; exit 1; }
          echo "[block comments] /* */ is skipped in pass files"

      - name: Block comment regression, data files (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # The line-oriented data files have their own hand-written C lexers,
          # so they get block comments from the shared stripper in
          # cs/libconsh/blockcom.cpp rather than from the RFB grammar. The
          # fixture puts comments in all four -- .seq (where a leading "/"
          # already means "inactive pass"), .kb, .dict and .kbb -- and probes
          # the loaded KB to prove the entries around them survived intact.
          # The .seq also takes "//" line comments, which collide with the same
          # leading "/", so the fixture covers those too.
          FIX=.github/workflows/tests/block-comments-data
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          # Dump every log the run produced. A KB-load failure (eg a bad .kb
          # command) only ever reaches cgerr.log, so without this a failure
          # here surfaces as "no out.txt" with no reason attached.
          for f in "$FIX"/logs/*.log; do
            [ -f "$f" ] || continue
            echo "----- $f"; cat "$f"
          done
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(data block comments): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want='zzTrailing|kbliteral|kbstarslash|kept|starred'
          if [ "$got" != "$want" ]; then
            echo "FAIL(data block comments): out.txt was '$got'"; exit 1
          fi
          # .dict string values must keep their delimiters byte-for-byte.
          grep -qF '("note" "a /* b */ c")' "$TREE" || { echo "FAIL(data block comments): dict string lost its /* */"; exit 1; }
          grep -qF '("note" "lone * and / here")' "$TREE" || { echo "FAIL(data block comments): dict string lost its * or /"; exit 1; }
          echo "[block comments] /* */ and .seq // are skipped in .seq, .kb, .dict and .kbb"

      - name: Run-mode globals ($dev / $silent, Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # NLP++ had no way to ask which mode the engine was run in, so
          # analyzers hardcoded their debug flags and no engine switch could
          # reach them. $dev lets a grammar gate its own diagnostic passes on
          # the caller's intent: G("verbose") = G("$dev");
          # -SILENT is NOT asserted here: it selects conf_ZILCH, which
          # suppresses the analyzer's own output files too, so there is no
          # out.txt to check under it.
          FIX=.github/workflows/tests/runmode-globals
          for mode in "" "-DEV"; do
            rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
            ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt" $mode
            OUT="$FIX/input/text.txt_log/out.txt"
            if [ ! -f "$OUT" ]; then
              echo "FAIL(run-mode): no out.txt for mode '${mode:-default}'"; exit 1
            fi
            got=$(tr -d '\r' < "$OUT")
            if [ -z "$mode" ]; then want="dev=0 silent=0"; else want="dev=1 silent=0"; fi
            if [ "$got" != "$want" ]; then
              echo "FAIL(run-mode ${mode:-default}): got '$got' wanted '$want'"; exit 1
            fi
          done
          echo "[run-mode] \$dev and \$silent report the engine's run mode"

      - name: struniquechars regression (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # str_unique_chars() used to rebuild an icu::StringPiece over its
          # OUTPUT buffer, call u_strlen() on it and re-decode it with
          # U8_NEXT -- once per input character. This pins the observable
          # behavior of struniquechars(), including multi-byte UTF-8, so the
          # rewrite (and any future one) cannot drift.
          FIX=.github/workflows/tests/struniquechars
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(struniquechars): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%b' 'abc|abc|a|abcdefg|helo wrd|3|ab\xc3\xa9\xc3\xbc|\xe6\x97\xa5\xe6\x9c\xac\xe8\xaa\x9e')
          if [ "$got" != "$want" ]; then
            echo "FAIL(struniquechars): out.txt was '$got' (wanted '$want')"; exit 1
          fi
          echo "[struniquechars] unique-character extraction is UTF-8 correct"

      - name: openfile creates the file it names (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # On Linux fnOpenfile started its open mode from std::ios::in, so the
          # stream opened read-write -- which cannot create a file -- and every
          # openfile("name") without a mode wrote nothing and reported nothing.
          # "app" worked, because in|app creates. Both must write.
          FIX=.github/workflows/tests/openfile-create
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          DIR="$FIX/input/text.txt_log"
          if [ ! -f "$DIR/out.txt" ]; then
            echo "FAIL(openfile): no out.txt -- the analyzer did not build"; exit 1
          fi
          for f in made appended; do
            if [ ! -f "$DIR/$f.txt" ]; then
              echo "FAIL(openfile): $f.txt was not created"; ls -la "$DIR"; exit 1
            fi
            got=$(tr -d '\r' < "$DIR/$f.txt")
            if [ "$got" != "$f" ]; then
              echo "FAIL(openfile): $f.txt was '$got'"; exit 1
            fi
          done
          echo "[openfile] openfile creates the file it names, with and without \"app\""

      - name: A rerun replaces the last run's output (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # A second run added to the first run's output. "file" << ... opens
          # for append and the engine reused <file>_log without emptying it, so
          # out.txt grew a line per run and a JSON export became several
          # documents in one file. The engine now empties the files in the
          # <file>_log folder it creates, and leaves subfolders alone.
          FIX=.github/workflows/tests/log-rerun
          LOG="$FIX/input/text.txt_log"
          rm -rf "$FIX/logs" "$LOG"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt" > /dev/null
          # Leave a stale file and a subfolder, then run again.
          echo stale > "$LOG/stale.txt"
          mkdir -p "$LOG/keep" && echo kept > "$LOG/keep/marker.txt"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt" > /dev/null
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          got=$(tr -d '\r' < "$LOG/out.txt")
          if [ "$got" != "ran" ]; then
            echo "FAIL(log rerun): out.txt after two runs was:"; echo "$got"; exit 1
          fi
          if [ -f "$LOG/stale.txt" ]; then
            echo "FAIL(log rerun): a file from the previous run survived"; exit 1
          fi
          if [ ! -f "$LOG/keep/marker.txt" ]; then
            echo "FAIL(log rerun): a subfolder of the log folder was removed"; exit 1
          fi
          echo "[log rerun] each run starts with an empty <file>_log"

      - name: regexp/regexpi glob matching (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # regexp() and regexpi() returned false for EVERY input: the "no
          # literal yet" marker in Regexp::init was an empty string rather
          # than a null pointer, so every "has a literal" test read true, the
          # literal never bound and the pattern degenerated. regexpi() also
          # recursed into the case-SENSITIVE match(), losing case folding
          # after the first pattern element -- hence the i-multi line.
          FIX=.github/workflows/tests/regexp-glob
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(regexp glob): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'star-tail:cat|' \
            'star-head:Walking|JumPing|' \
            'star-both:Walking|cat|' \
            'literal:cat|' \
            'qmark:cat|' \
            'whole:0' \
            'i-multi:RUNNING|' \
            'i-head:RUNNING|Walking|JumPing|' \
            'nomatch:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(regexp glob): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[regexp glob] regexp/regexpi match, and regexpi folds case throughout"

      - name: Signed numbers in str() (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # str() converted a signed long long with the UNSIGNED "%llu", so
          # every negative printed as roughly 1.8e19 -- str(-1) gave
          # "18446744073709551615" -- which also made the documented -1
          # return of filesize() unreadable. The same fault was in the
          # compiled-analyzer path (Arun::str) and in the code generator.
          FIX=.github/workflows/tests/signed-str
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(signed str): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'expr:-1' 'big:-12345' 'filesize:-1' 'pos:42' 'zero:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(signed str): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[signed str] negative numbers render as negative"

      - name: Empty string literal (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # An empty string literal was a hard syntax error for 28 years:
          # PostRFA::postRFAstr bailed with "Unhandled null case" because the
          # _STR rule's content wild legitimately collects nothing between the
          # quotes. Amnon's own 11/26/98 note there asked for this fix. So
          # L("x") = "" would not build, and neither would the natural emptiness
          # test x != "" -- which read to users as "!= is broken on strings".
          # Behind it: the hash table refuses to intern "" so any builtin
          # RETURNING empty logged "[hget: Given null string.]" and returned 0,
          # and strtrim/strclean/struniquechars warned instead of returning "".
          # This pins all three layers, including a clean err.log.
          FIX=.github/workflows/tests/empty-string
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(empty string): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'assign:[]' 'lit:[]' 'ne_nonempty:1' 'eq_nonempty:0' 'ne_empty:0' 'eq_empty:1' 'lit_eq_lit:1' 'if_nonempty:taken' 'if_empty:NOT' 'len:0' 'subst_del:[hello ]' 'subst_all:[]' 'concat:[ab]' 'trim:[]' 'clean:[]' 'uniq:[]' 'roundtrip:1')
          if [ "$got" != "$want" ]; then
            echo "FAIL(empty string): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          # An empty string must not log errors on the way through.
          ERR="$FIX/input/text.txt_log/err.log"
          if [ -f "$ERR" ]; then
            noise=$(grep -v '^0 0 \[Date' "$ERR" | tr -d '\r' | sed '/^$/d' || true)
            if [ -n "$noise" ]; then
              echo "FAIL(empty string): err.log not clean:"; echo "$noise"; exit 1
            fi
          fi
          echo "[empty string] \"\" is a first-class empty string"

      - name: cout() writes to standard output (Non-20.04)
        if: matrix.id != 'docker-ubuntu-20.04'
        shell: bash
        run: |
          set -eo pipefail
          # The command-line engine bound the analyzer's cout() stream to a
          # leftover test file (e:\dummy.txt on Windows, ./dummy.txt on
          # Linux), so cout() output never reached the terminal.
          FIX=.github/workflows/tests/cout-stdout
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log" dummy.txt
          mkdir -p "$FIX/logs"
          out=$(./bin/nlp -ANA "$FIX" -WORK ./ "$FIX/input/text.txt" | tr -d '\r')
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          # Engine status lines go to stderr, so stdout is the analyzer's
          # output and nothing else.
          want=$(printf '%s\n' "cout-stdout: hello" "cout-stdout: via a variable")
          if [ "$out" != "$want" ]; then
            echo "FAIL(cout): stdout was:"; echo "$out"; echo "wanted:"; echo "$want"; exit 1
          fi
          if [ -f dummy.txt ]; then
