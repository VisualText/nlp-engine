name: Windows

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  # Build the tagged commit itself so the release binary carries the right
  # version. (A `tags:` filter under `pull_request` is ignored by GitHub --
  # it must live under `push:`.)
  push:
    tags:
      - '*'

jobs:
  build_engine:
    name: Build NLP-ENGINE
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Vcpkg bootstrap Windows
        run: bootstrap-vcpkg.bat
        working-directory: vcpkg

      - name: Install 3rd Party
        run: vcpkg install
        working-directory: vcpkg

      - name: List $RUNNER_WORKSPACE before build
        shell: pwsh
        run: Get-ChildItem -Path $env:RUNNER_WORKSPACE -Recurse -Force | Select-Object FullName

      - name: Make build directory
        run: mkdir build

      - name: Generate Solution Windows
        run: cmake -B build -A x64 -DCMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Cmake Build all targets Windows
        run: cmake --build build --config Release --target nlp

      - name: Test executable --version
        run: ./bin/Release/nlp.exe --version || true

      - name: Full-dict binary-search hang regression (#669)
        # An em-dash sorts after every word in the lazy "*full.dict"; pre-fix the
        # dict binary search looped forever (afterKey=-1 at EOF -> lo=-1). The
        # self-contained fixture must complete; if it hangs, this step exceeds
        # timeout-minutes and fails the job (no `|| true`).
        timeout-minutes: 3
        shell: bash
        run: |
          ./bin/Release/nlp.exe -ANA .github/workflows/tests/fulldict-hang \
            -WORK ./ .github/workflows/tests/fulldict-hang/input/dash.txt
          echo "[#669 regression] analyzer completed without hanging"

      - name: Function names with digits regression (#698)
        shell: bash
        run: |
          set -eo pipefail
          # The rule-file tokenizer splits "Round2" into "Round" + "2", so
          # user functions whose name held a digit or an underscore never
          # matched the "_LIT \(" function grammar and the analyzer died with
          # a misleading "[Warning: Missing ';']". The fixture also asserts
          # that @RULES literals ("covid19", "a1 \(") still tokenize the old
          # way -- the glom must only fire on an unescaped "(".
          FIX=.github/workflows/tests/fnname-digits
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          # Windows always leaves a make_ana.log behind; Linux only writes one
          # when the build had something to say. Print it if it's there.
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          # nlp exits 0 even when the analyzer fails to build, so assert the
          # output, not the exit code.
          if [ ! -f "$OUT" ]; then
            echo "FAIL(#698): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          if [ "$got" != "3 21 201 2001 1 8 71" ]; then
            echo "FAIL(#698): out.txt was '$got'"; exit 1
          fi
          grep -q '_COVID' "$TREE" || { echo "FAIL(#698): literal covid19 no longer matches two tokens"; exit 1; }
          grep -q '_APAREN' "$TREE" || { echo "FAIL(#698): escaped '\\(' literal regressed"; exit 1; }
          echo "[#698 regression] digit/underscore function names compile and run"

      - name: Block comment regression
        shell: bash
        run: |
          set -eo pipefail
          # NLP++ knew only "#" line comments, so a C-style "/* ... */" in a
          # pass file lexed as ordinary tokens and died with "[Syntax error.]".
          # The fixture checks that comments are skipped everywhere (@DECL,
          # @CODE, around and inside @RULES), that "/*" and "*/" inside a
          # string or a "#" comment stay text, that "/" and "*" still parse as
          # operators, and that a rule can still match a literal "/" "*" in
          # the INPUT text (_SLASHSTAR / _STARSLASH).
          FIX=.github/workflows/tests/block-comments
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          # nlp exits 0 even when the analyzer fails to build, so assert the
          # output, not the exit code.
          if [ ! -f "$OUT" ]; then
            echo "FAIL(block comments): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want='a string with /* and */ inside|/*/|7|12|43|esc: * /'
          if [ "$got" != "$want" ]; then
            echo "FAIL(block comments): out.txt was '$got'"; exit 1
          fi
          grep -q '_SLASHSTAR' "$TREE" || { echo "FAIL(block comments): rule matching a literal '/' '*' in input regressed"; exit 1; }
          grep -q '_STARSLASH' "$TREE" || { echo "FAIL(block comments): rule matching a literal '*' '/' in input regressed"; exit 1; }
          echo "[block comments] /* */ is skipped in pass files"

      - name: Block comment regression, data files
        shell: bash
        run: |
          set -eo pipefail
          # The line-oriented data files have their own hand-written C lexers,
          # so they get block comments from the shared stripper in
          # cs/libconsh/blockcom.cpp rather than from the RFB grammar. The
          # fixture puts comments in all four -- .seq (where a leading "/"
          # already means "inactive pass"), .kb, .dict and .kbb -- and probes
          # the loaded KB to prove the entries around them survived intact.
          FIX=.github/workflows/tests/block-comments-data
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          # Dump every log the run produced. A KB-load failure (eg a bad .kb
          # command) only ever reaches cgerr.log, so without this a failure
          # here surfaces as "no out.txt" with no reason attached.
          for f in "$FIX"/logs/*.log; do
            [ -f "$f" ] || continue
            echo "----- $f"; cat "$f"
          done
          OUT="$FIX/input/text.txt_log/out.txt"
          TREE="$FIX/input/text.txt_log/final.tree"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(data block comments): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want='zzTrailing|kbliteral|kbstarslash|kept|starred'
          if [ "$got" != "$want" ]; then
            echo "FAIL(data block comments): out.txt was '$got'"; exit 1
          fi
          # .dict string values must keep their delimiters byte-for-byte.
          grep -qF '("note" "a /* b */ c")' "$TREE" || { echo "FAIL(data block comments): dict string lost its /* */"; exit 1; }
          grep -qF '("note" "lone * and / here")' "$TREE" || { echo "FAIL(data block comments): dict string lost its * or /"; exit 1; }
          echo "[block comments] /* */ is skipped in .seq, .kb, .dict and .kbb"

      - name: struniquechars regression
        shell: bash
        run: |
          set -eo pipefail
          # str_unique_chars() used to rebuild an icu::StringPiece over its
          # OUTPUT buffer, call u_strlen() on it and re-decode it with
          # U8_NEXT -- once per input character. This pins the observable
          # behavior of struniquechars(), including multi-byte UTF-8, so the
          # rewrite (and any future one) cannot drift.
          FIX=.github/workflows/tests/struniquechars
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(struniquechars): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%b' 'abc|abc|a|abcdefg|helo wrd|3|ab\xc3\xa9\xc3\xbc|\xe6\x97\xa5\xe6\x9c\xac\xe8\xaa\x9e')
          if [ "$got" != "$want" ]; then
            echo "FAIL(struniquechars): out.txt was '$got' (wanted '$want')"; exit 1
          fi
          echo "[struniquechars] unique-character extraction is UTF-8 correct"

      - name: regexp/regexpi glob matching
        shell: bash
        run: |
          set -eo pipefail
          # regexp() and regexpi() returned false for EVERY input: the "no
          # literal yet" marker in Regexp::init was an empty string rather
          # than a null pointer, so every "has a literal" test read true, the
          # literal never bound and the pattern degenerated. regexpi() also
          # recursed into the case-SENSITIVE match(), losing case folding
          # after the first pattern element -- hence the i-multi line.
          FIX=.github/workflows/tests/regexp-glob
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(regexp glob): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'star-tail:cat|' \
            'star-head:Walking|JumPing|' \
            'star-both:Walking|cat|' \
            'literal:cat|' \
            'qmark:cat|' \
            'whole:0' \
            'i-multi:RUNNING|' \
            'i-head:RUNNING|Walking|JumPing|' \
            'nomatch:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(regexp glob): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[regexp glob] regexp/regexpi match, and regexpi folds case throughout"

      - name: Signed numbers in str()
        shell: bash
        run: |
          set -eo pipefail
          # str() converted a signed long long with the UNSIGNED "%llu", so
          # every negative printed as roughly 1.8e19 -- str(-1) gave
          # "18446744073709551615" -- which also made the documented -1
          # return of filesize() unreadable. The same fault was in the
          # compiled-analyzer path (Arun::str) and in the code generator.
          FIX=.github/workflows/tests/signed-str
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(signed str): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'expr:-1' 'big:-12345' 'filesize:-1' 'pos:42' 'zero:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(signed str): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[signed str] negative numbers render as negative"

      - name: User functions shadow builtins
        shell: bash
        run: |
          set -eo pipefail
          # Defining a function whose name is also a builtin used to be a hard
          # error, so adding any builtin broke every analyzer that had already
          # defined that name -- which is what happened to arrayreverse and
          # push, hand-written in visualText/spec/UtilFuncs.nlp long before
          # they became builtins. The user definition now wins, with a warning.
          FIX=.github/workflows/tests/shadowing
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          mkdir -p "$FIX/logs"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(shadowing): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' 'shadowed:USER-WON' 'unshadowed:HELLO' 'stilldispatches:5')
          if [ "$got" != "$want" ]; then
            echo "FAIL(shadowing): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          # make_analyzer only writes make_ana.log when logs/ already exists,
          # which is why the step recreates it above. Without that, Linux left
          # no log to grep while Windows created the directory on the way.
          if ! grep -q "shadows built-in" "$FIX/logs/make_ana.log"; then
            echo "FAIL(shadowing): the shadowing warning was never emitted"; exit 1
          fi
          echo "[shadowing] a user function overrides a builtin of the same name"

      - name: File-reading and regex builtins
        shell: bash
        run: |
          set -eo pipefail
          # NLP++ could write files but never read one, could not list a
          # directory, and regexp() was a "?"/"*" glob with no classes,
          # anchors, quantifiers or capture groups. This pins readfile,
          # readlines, dirlist, rematch, refind and resubst.
          # readfile's line is run through resubst so the expected output is
          # the same whether the fixture is checked out LF or CRLF, and the
          # dirlist line proves paths come back sorted with forward slashes
          # on every platform.
          FIX=.github/workflows/tests/file-regex
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(file/regex): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'dirlist:3:alpha.dict:beta.dict:config.txt' \
            'glob:2' \
            'readlines:2:name = widget:count = 42' \
            'readfile:name = widget|count = 42|' \
            'rematch:1010' \
            'refind:3:count:42' \
            'resubst:1a 2b 3c' \
            'empty:0')
          if [ "$got" != "$want" ]; then
            echo "FAIL(file/regex): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[file/regex] readfile, readlines, dirlist, rematch, refind, resubst"

      - name: String and array builtins
        shell: bash
        run: |
          set -eo pipefail
          # split() had no inverse, there was no way to get the index of a
          # substring, and every existing sort was knowledge-base or parse
          # tree oriented, leaving plain arrays with none. push() had been
          # documented as UNIMPLEMENTED.
          # sort: is byte order, so uppercase sorts ahead of lowercase.
          # neg: re-checks that str() renders negatives as negative.
          FIX=.github/workflows/tests/str-array
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          if [ -f "$FIX/logs/make_ana.log" ]; then cat "$FIX/logs/make_ana.log"; fi
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(str/array): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          want=$(printf '%s\n' \
            'join:a-b-c' \
            'join1:solo' \
            'joinnum:1,2,3' \
            'idx:6/-1/0' \
            'lastidx:8/2' \
            'neg:-1/-1/-12345/42' \
            'sort:Banana,apple,cherry' \
            'sortdesc:cherry,apple,Banana' \
            'sortnum:2,10,100' \
            'sortnumdesc:100,10,2' \
            'unique:a,b,c' \
            'reverse:c,b,a' \
            'slice:b,c' \
            'sliceopen:c,d' \
            'sliceclamp:d' \
            'slicenone:' \
            'push:z,a,b,c' \
            'chain:A,B,C')
          if [ "$got" != "$want" ]; then
            echo "FAIL(str/array): out.txt was:"; echo "$got"
            echo "wanted:"; echo "$want"; exit 1
          fi
          echo "[str/array] strjoin, strindexof, arraysort/unique/reverse/slice, push"

      - name: Python pass interpreter and error reporting
        shell: bash
        run: |
          set -eo pipefail
          # The python pass hardcoded the command "python". macOS 12.3+ has no
          # /usr/bin/python and most Linux distros ship only python3, so on many
          # machines the pass silently did nothing: system() returns the shell's
          # exit status (127 for command-not-found), never <0, so the old rc<0
          # test never fired. For json2kbb that meant no .kbb was built and the
          # analyzer ran against an empty KB with no warning at all.
          FIX=.github/workflows/tests/python-pass
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log" "$FIX/marker.txt"
          mkdir -p "$FIX/logs"
          ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt"
          OUT="$FIX/input/text.txt_log/out.txt"
          if [ ! -f "$OUT" ]; then
            echo "FAIL(python pass): no out.txt -- the analyzer did not build"; exit 1
          fi
          got=$(tr -d '\r' < "$OUT")
          if [ "$got" != "python:PYTHON-RAN-pre" ]; then
            echo "FAIL(python pass): the pass did not run. out.txt was '$got'"; exit 1
          fi
          # Now prove a missing interpreter is REPORTED rather than swallowed.
          rm -rf "$FIX/logs" "$FIX/input/text.txt_log" "$FIX/marker.txt"
          mkdir -p "$FIX/logs"
          NLPPP_PYTHON=definitely-not-a-real-interpreter \
            ./bin/Release/nlp.exe -ANA "$FIX" -WORK ./ "$FIX/input/text.txt" > pyfail.out 2>&1 || true
          cat pyfail.out
          got=$(tr -d '\r' < "$OUT")
          if [ "$got" != "python:absent" ]; then
            echo "FAIL(python pass): expected the pass to be skipped, got '$got'"; exit 1
          fi
          if ! grep -q "python pass FAILED" pyfail.out; then
            echo "FAIL(python pass): a failing pass was not reported"; exit 1
          fi
          if ! grep -q "python pass" "$FIX/input/text.txt_log/err.log"; then
            echo "FAIL(python pass): the failure never reached err.log"; exit 1
          fi
          echo "[python pass] interpreter is resolved, and failures are reported"

      - name: Copy nlp.exe to nlpw.exe
        run: cp bin/Release/nlp.exe bin/Release/nlpw.exe
        shell: bash

      - name: Upload nlpw.exe
        uses: actions/upload-artifact@v4
        with:
          name: nlpw.exe
          path: bin/Release/nlpw.exe

      - name: Copy ICU DLLs to bin/Release
        shell: pwsh
        run: |
          # lite.lib references icuin78 (Collator) via find_str_nocase; without this DLL
          # downstream analyzer/KB compilation fails with LNK2019.
          Copy-Item "vcpkg/packages/icu_x64-windows/bin/icudt78.dll" "bin/Release/icudt78.dll"
          Copy-Item "vcpkg/packages/icu_x64-windows/bin/icuuc78.dll" "bin/Release/icuuc78.dll"
          Copy-Item "vcpkg/packages/icu_x64-windows/bin/icuin78.dll" "bin/Release/icuin78.dll"

      - name: Upload icudt78.dll
        uses: actions/upload-artifact@v4
        with:
          name: icudt78.dll
          path: bin/Release/icudt78.dll

      - name: Upload icuuc78.dll
        uses: actions/upload-artifact@v4
        with:
          name: icuuc78.dll
          path: bin/Release/icuuc78.dll

      - name: Upload icuin78.dll
        uses: actions/upload-artifact@v4
        with:
          name: icuin78.dll
          path: bin/Release/icuin78.dll

      - name: Package compile libraries (prim/kbm/consh/words/lite)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $outRoot = Join-Path $env:GITHUB_WORKSPACE 'compile-libs'
          $includeRoot = Join-Path $outRoot 'include'
          $libRoot = Join-Path $outRoot 'lib'
          New-Item -ItemType Directory -Force -Path $includeRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $libRoot | Out-Null

          # Header trees used by analyzer/KB generated C++.
          # Keep Api at include/Api so vscode-nlp can add include/Api as an include root.
          New-Item -ItemType Directory -Force -Path (Join-Path $includeRoot 'Api') | Out-Null
          Copy-Item -Recurse -Force 'include/Api/*' (Join-Path $includeRoot 'Api')
          Copy-Item -Recurse -Force 'cs/include' (Join-Path $includeRoot 'cs')

          $requiredLibs = @('prim','kbm','consh','words','lite')
          foreach ($name in $requiredLibs) {
            $lib = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "$name.lib" |
              Where-Object { $_.FullName -notmatch '\\vcpkg\\' } |
              Select-Object -First 1

            if (-not $lib) {
              throw "Missing required static library: $name.lib"
            }

            Copy-Item -Force $lib.FullName (Join-Path $libRoot "$name.lib")
          }

          # ICU import libs from vcpkg. lite.lib's find_str_nocase references
          # icuin78 (Collator), and prim.lib pulls in icuuc78/icudt78.
          # Downstream analyzer/KB compilation linking against the engine
          # static libs above will fail with LNK2019 without these.
          $icuLibDir = Join-Path $env:GITHUB_WORKSPACE 'vcpkg/packages/icu_x64-windows/lib'
          $icuLibs = Get-ChildItem -Path $icuLibDir -File -Filter "icu*.lib" -ErrorAction Stop
          if ($icuLibs.Count -lt 3) {
            throw "Expected at least 3 ICU import libs in $icuLibDir, found $($icuLibs.Count)"
          }
          foreach ($icu in $icuLibs) {
            Copy-Item -Force $icu.FullName (Join-Path $libRoot $icu.Name)
          }

          Compress-Archive -Path (Join-Path $outRoot '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'nlpengine-compile-libs.zip') -Force

      - name: Upload nlpengine-compile-libs.zip
        uses: actions/upload-artifact@v4
        with:
          name: nlpengine-compile-libs.zip
          path: nlpengine-compile-libs.zip

      - name: Checkout Analyzers repo
        uses: actions/checkout@v4
        with:
          repository: VisualText/analyzers
          submodules: recursive
          path: analyzers

      - name: List runner workspace
        shell: pwsh
        run: Get-ChildItem -Path $env:RUNNER_WORKSPACE -Recurse -Force | Select-Object FullName

      - name: Run English Parser
        run: ./bin/Release/nlp.exe -ANA .\analyzers\parse-en-us -WORK D:\a\nlp-engine\nlp-engine .\analyzers\parse-en-us\input\doj.txt -DEV || true

      - name: Full English Test
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./analyzers/parse-en-us/input/doj.txt_log/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-win.txt
